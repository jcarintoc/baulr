name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification tests
        run: |
          pnpm test
          pnpm build

      - name: Download Rclone sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries
          curl -L -o rclone.zip https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-osx-arm64.zip
          unzip -j -q rclone.zip "*/rclone" -d src-tauri/binaries/
          mv src-tauri/binaries/rclone src-tauri/binaries/rclone-aarch64-apple-darwin
          chmod +x src-tauri/binaries/rclone-aarch64-apple-darwin
          rm rclone.zip

      - name: Download Rclone sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Invoke-WebRequest -Uri "https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path "rclone.zip" -DestinationPath "rclone-extracted" -Force
          $rcloneExe = Get-ChildItem -Path "rclone-extracted" -Filter "rclone.exe" -Recurse | Select-Object -First 1
          Move-Item -Path $rcloneExe.FullName -Destination "src-tauri/binaries/rclone-x86_64-pc-windows-msvc.exe" -Force
          Remove-Item -Recurse -Force "rclone.zip", "rclone-extracted"

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Baulr v__VERSION__'
          releaseBody: 'See changelog and release notes.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload unversioned permalink asset (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          DMG_FILE=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            DMG_FILE=$(find src-tauri/target -name "*.dmg" ! -name "Baulr-mac-arm64.dmg" | head -n 1)
          fi
          if [ -z "$DMG_FILE" ]; then
            echo "Error: Could not locate built .dmg file" >&2
            exit 1
          fi
          echo "Found DMG: $DMG_FILE"
          cp "$DMG_FILE" Baulr-mac-arm64.dmg
          gh release upload "$TAG" Baulr-mac-arm64.dmg --clobber

      - name: Upload unversioned permalink asset (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $setupExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setupExe) {
            $setupExe = Get-ChildItem -Path "src-tauri/target" -Filter "*-setup.exe" -Recurse | Select-Object -First 1
          }
          if (-not $setupExe) {
            Write-Error "Could not locate built *-setup.exe file"
            exit 1
          }
          Write-Host "Found NSIS installer: $($setupExe.FullName)"
          Copy-Item -Path $setupExe.FullName -Destination "Baulr-windows-x64.exe" -Force
          gh release upload "$tag" Baulr-windows-x64.exe --clobber
